<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVA: Memoria en sistemas operativos</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08110f;--panel:#0f1c19;--ink:#e7f5ef;--mute:#93b3a8;--line:#244037;--acc:#2de2a6;--acc2:#4fd8f0;--bad:#e5533d;--ok:#2de2a6;--soft:rgba(45,226,166,.09);--dk:#05201a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.65 "Atkinson Hyperlegible",system-ui,sans-serif;background:radial-gradient(900px 520px at 88% -8%,rgba(45,226,166,.15),transparent 60%),radial-gradient(700px 500px at 0% 45%,rgba(79,216,240,.09),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0 0 .5em}
h2{font-size:1.45rem;margin:1.7em 0 .6em;padding-left:14px;border-left:4px solid var(--acc2)}
h3{color:var(--acc)}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,#0c1a16,#070e0c);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.chip{display:block;background:#f4f5f4;border-radius:12px;padding:10px 14px}
.chip img{display:block;width:100%;height:auto}
#brand .chip{margin-bottom:16px}
.id{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.id img{width:60px;height:60px;flex:none}
nav h1{font-size:1.05rem;margin:0;color:var(--ink)}
nav p{font-size:.85rem;color:var(--mute);margin:0 0 14px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:#cfe5dc;font:inherit;font-size:.95rem;padding:10px;border-radius:10px;cursor:pointer}
nav button:hover{background:rgba(45,226,166,.1)}
nav button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--dk);font-weight:700}
nav .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #4b6e63;display:grid;place-items:center;font-size:.75rem}
nav button.on .dot{border-color:var(--dk)}
nav button.done .dot{background:var(--ok);border-color:var(--ok);color:var(--dk)}
.bar{height:8px;background:#17302a;border-radius:4px;margin:6px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .4s}
main{padding:26px min(5vw,56px) 80px;max-width:940px}
.banner{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(135deg,#0f2d25,#0a1714);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin-bottom:22px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.banner .chip{width:min(330px,100%)}
.banner .lc{width:104px;height:104px}
.banner .bt{flex:1;min-width:200px;color:var(--mute)}
.banner .bt b{display:block;font:800 1.5rem/1.2 "Bricolage Grotesque",sans-serif;color:var(--ink)}
.hero{margin:6px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.9rem);margin:0}
.badge{display:inline-block;background:var(--soft);color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.85rem;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:20px 0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.def{border-left:4px solid var(--acc);background:var(--soft);padding:14px 18px;border-radius:0 12px 12px 0;margin:16px 0}
.def b{display:block;font-family:"Bricolage Grotesque",sans-serif;color:var(--acc);margin-bottom:2px}
.lead{font-size:1.15rem;color:var(--mute)}
.goals{padding-left:1.1em;margin:0}
label{font-weight:700;font-size:.95rem}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0a1512;color:var(--ink);max-width:100%}
input:focus,select:focus{border-color:var(--acc)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.row>div{display:flex;flex-direction:column;gap:4px}
.hole{height:34px;border-radius:8px;background:var(--soft);border:1px solid var(--acc);margin:6px 0;display:flex;align-items:center;padding:0 10px;font-size:.88rem;white-space:nowrap;overflow:hidden}
.hole.pick{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--dk);border-color:var(--acc2);font-weight:700}
.hole.off{opacity:.4}
.out{background:#0a1512;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px}
.out b{color:var(--acc2)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:#12302a;color:var(--acc)}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
td.miss{background:var(--bad)!important;color:#fff;font-weight:700}
.q{margin:16px 0;padding-top:14px;border-top:1px solid var(--line)}
.q button.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;font:inherit;background:#0a1512;color:var(--ink);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.q button.opt:hover{border-color:var(--acc)}
.q button.opt.right{border-color:var(--ok);background:var(--soft)}
.q button.opt.wrong{border-color:var(--bad)}
.fb{font-size:.95rem;margin-top:6px}
.nxt{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:12px;border:0;background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--dk);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(8,17,15,.88);backdrop-filter:blur(8px);padding:8px 12px;margin:0 0 18px;border:1px solid var(--line);border-radius:14px}
.topnav span{font-weight:700;color:var(--mute);font-size:.95rem;text-align:center}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (max-width:760px){.app{display:block}nav{position:static;height:auto;border-right:0}main{padding:20px 14px 60px}.chip{max-width:340px}}
</style></head>

<nav aria-label="Módulos">
<div id="brand"></div>
<p>Objeto virtual de aprendizaje · 9 módulos</p>
<div class="bar" title="Progreso"><i id="prog"></i></div>
<div id="menu"></div>
</nav>
<main id="main" tabindex="-1"></main>
</div>

{t:"Fundamentos de la memoria",
 h:`<p class="lead">Antes de ver cómo el sistema operativo reparte la memoria, hay que entender qué es y por qué es un recurso tan disputado.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Definir qué es la memoria y qué papel cumple la memoria principal.</li><li>Distinguir la jerarquía de memoria.</li><li>Diferenciar dirección lógica y dirección física.</li></ul></div>
<h2>¿Qué es la memoria?</h2>
<p>La <b>memoria</b> es el componente del computador que almacena los programas y los datos que el procesador necesita. Se ve como una sucesión de posiciones (bytes o palabras), cada una con una <b>dirección</b> única. En el modelo de programa almacenado, el procesador solo accede directamente a los registros y a la RAM; los datos del disco deben copiarse antes a la RAM.</p>
<div class="def"><b>Memoria principal (RAM)</b>Memoria <i>volátil</i> (pierde su contenido sin energía), de acceso directo y rápido, donde residen el sistema operativo y los procesos en ejecución. Se distingue del almacenamiento secundario (HDD/SSD), que es no volátil, más lento y mucho más grande.</div>
<p>La RAM se reparte entre el SO (zona protegida del núcleo) y los procesos de usuario. Cada proceso tiene su <b>espacio de direcciones</b>: el conjunto de direcciones que puede usar (código, datos, montículo y pila).</p>
<h2>¿Por qué el SO administra la memoria?</h2>
<p>Para que la CPU ejecute un programa, sus instrucciones y datos (al menos la parte en uso) deben estar en la memoria principal (RAM). Como varios procesos conviven al mismo tiempo, el sistema operativo debe decidir quién usa qué zona, protegerlos entre sí y aprovechar al máximo el espacio disponible.</p>
<div class="def"><b>Las cuatro tareas del administrador de memoria</b>1) Llevar el control de qué partes están libres u ocupadas. 2) Asignar y liberar memoria a los procesos. 3) Proteger el espacio de cada proceso. 4) Decidir qué se queda en RAM y qué se mueve al disco.</div>
<h2>Jerarquía de memoria</h2>
<p>Cuanto más rápida es una memoria, más cara y más pequeña es. Por eso se organiza en niveles: el procesador consulta primero los niveles rápidos.</p>
<div class="scroll"><table><tr><th>Nivel</th><th>Velocidad</th><th>Capacidad típica</th></tr><tr><td>Registros</td><td>Inmediata</td><td>Bytes</td></tr><tr><td>Caché (L1–L3)</td><td>Muy rápida</td><td>KB a decenas de MB</td></tr><tr><td>Memoria principal (RAM)</td><td>Rápida</td><td>GB</td></tr><tr><td>Disco (SSD/HDD)</td><td>Lenta</td><td>Cientos de GB a TB</td></tr></table></div>
<h2>Direcciones lógicas y físicas</h2>
<p>El proceso trabaja con <b>direcciones lógicas</b> (como si tuviera la memoria para él solo). La unidad de gestión de memoria (<b>MMU</b>) las traduce a <b>direcciones físicas</b>, que son las posiciones reales en la RAM.</p>
<div class="def"><b>Ejemplo cotidiano</b>La dirección lógica es el número de apartamento “301”; la física es la dirección completa del edificio. Cada edificio tiene su propio “301”, y alguien (la MMU) sabe a cuál te refieres.</div>
<h2>¿Cuándo se asignan las direcciones físicas?</h2>
<p>Pueden quedar fijadas en <b>compilación</b> (código absoluto, si se sabe dónde se cargará), en <b>carga</b> (código reubicable) o en <b>ejecución</b> (el proceso puede moverse mientras corre). Los sistemas modernos usan enlace en ejecución mediante la MMU, lo que hace posibles la paginación y la memoria virtual.</p>`,
 q:[{p:"¿Cuál afirmación sobre la memoria principal (RAM) es correcta?",o:["Es no volátil y guarda los archivos de forma permanente","Es volátil y la CPU puede acceder a ella directamente","Es más lenta que el disco"],a:1,f:"La RAM pierde su contenido sin energía y es de acceso directo y rápido, por eso allí deben estar los procesos en ejecución."},
    {p:"¿Qué componente traduce direcciones lógicas a físicas?",o:["La caché","La MMU","El disco duro"],a:1,f:"La MMU realiza la traducción en hardware, en cada acceso a memoria."},
    {p:"¿Cuál nivel de la jerarquía es el más rápido y pequeño?",o:["Registros","RAM","SSD"],a:0,f:"Los registros están dentro del procesador y solo guardan unos pocos bytes."}]},
{t:"Asignación contigua",
 h:`<p class="lead">La forma más simple de repartir memoria: darle a cada proceso un bloque seguido de direcciones.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Describir la asignación contigua con particiones variables.</li><li>Aplicar primer ajuste, mejor ajuste y peor ajuste.</li><li>Reconocer la fragmentación.</li></ul></div>
<h2>¿Cómo funciona?</h2>
<p>La memoria se divide en bloques. Cuando llega un proceso, el SO busca un “hueco” libre donde quepa completo. Al terminar, el proceso libera su bloque y el hueco queda disponible otra vez. Hay dos variantes: en <b>particiones fijas</b> la memoria se divide de antemano en bloques de tamaño fijo (aparece fragmentación interna); en <b>particiones variables</b> cada proceso recibe justo lo que necesita (aparece fragmentación externa).</p>
<h2>Estrategias para elegir el hueco</h2>
<div class="def"><b>Primer ajuste (first fit)</b>Usa el primer hueco que sea suficientemente grande. Es rápido.</div>
<div class="def"><b>Mejor ajuste (best fit)</b>Usa el hueco más pequeño donde quepa el proceso. Deja sobrantes diminutos.</div>
<div class="def"><b>Peor ajuste (worst fit)</b>Usa el hueco más grande, esperando que el sobrante siga siendo útil.</div>
<h2>Fragmentación</h2>
<p>La <b>fragmentación externa</b> ocurre cuando hay suficiente memoria libre en total, pero repartida en huecos pequeños separados, así que ningún hueco alcanza para un proceso. La <b>fragmentación interna</b> es el espacio desperdiciado dentro de un bloque asignado que el proceso no usa. La solución a la externa es la <b>compactación</b> (juntar los huecos moviendo procesos) o dejar de exigir contigüidad, como hace la paginación.</p>
<div class="def"><b>Costo de la compactación</b>Mover procesos consume tiempo de CPU y exige que las direcciones se resuelvan en ejecución (reubicación dinámica con registro base). Por eso solo se usa cuando el sistema lo permite y compensa.</div>
<div class="def"><b>Regla del 50 %</b>Con primer ajuste, por cada N bloques asignados se pierden en promedio unos N/2 bloques por fragmentación externa: aproximadamente un tercio de la memoria queda inutilizable.</div>
<h2>Comparación de las estrategias</h2>
<div class="scroll"><table><tr><th>Estrategia</th><th>Búsqueda</th><th>Efecto sobre los huecos</th></tr><tr><td>Primer ajuste</td><td>Se detiene en el primero que sirve (rápida)</td><td>Concentra los huecos pequeños al inicio</td></tr><tr><td>Mejor ajuste</td><td>Recorre todos los huecos (más lenta)</td><td>Deja muchos huecos diminutos e inútiles</td></tr><tr><td>Peor ajuste</td><td>Recorre todos los huecos (más lenta)</td><td>Destruye los huecos grandes; en la práctica rinde peor</td></tr></table></div>
<h2>Sistema buddy (compañeros)</h2>
<p>Reparte la memoria en bloques cuyo tamaño es potencia de 2. Si se pide 70 KB se entrega un bloque de 128 KB (58 KB de fragmentación interna). Los bloques grandes se parten en dos “compañeros”; al liberarse, dos compañeros libres se fusionan. Es rápido y limita la fragmentación externa; Linux lo usa para entregar páginas físicas.</p>
<div class="card"><h3>Pruébalo: ¿dónde se ubica el proceso?</h3>
<p>Los huecos libres de la memoria son 100, 500, 200, 300 y 600 KB. Elige el tamaño del proceso y la estrategia.</p>
<div class="row"><div><label for="fs">Tamaño del proceso (KB)</label><input id="fs" type="number" value="212" min="1" max="700"></div><div><label for="fa">Estrategia</label><select id="fa"><option value="f">Primer ajuste</option><option value="b">Mejor ajuste</option><option value="w">Peor ajuste</option></select></div></div>
<div id="fh"></div><div class="out" id="fo"></div></div>`,
 init:function(){var H=[100,500,200,300,600];function r(){var s=Math.max(1,+$("fs").value||1),a=$("fa").value,p=-1;H.forEach(function(h,i){if(h<s)return;if(p<0||(a=="b"&&h<H[p])||(a=="w"&&h>H[p]))p=i});
  $("fh").innerHTML=H.map(function(h,i){return '<div class="hole '+(i==p?'pick':(h<s?'off':''))+'" style="width:'+(h/7+8)+'%">Hueco '+(i+1)+': '+h+' KB'+(i==p?' ← elegido':'')+'</div>'}).join("");
  $("fo").textContent=p<0?"Ningún hueco alcanza. Aunque la suma de los huecos sea "+H.reduce(function(x,y){return x+y})+" KB, están separados: es fragmentación externa.":"El proceso de "+s+" KB va al hueco "+(p+1)+". Sobran "+(H[p]-s)+" KB como nuevo hueco."}
  $("fs").oninput=$("fa").onchange=r;r()},
 q:[{p:"Existe un hueco de 150 KB y otro de 400 KB. Llega un proceso de 120 KB. ¿Cuál elige el mejor ajuste?",o:["El de 150 KB","El de 400 KB","Ninguno"],a:0,f:"El mejor ajuste elige el hueco más pequeño donde quepa: 150 KB."},
    {p:"Hay 300 KB libres en total pero en huecos de 100 KB separados y llega un proceso de 200 KB. ¿Qué problema es?",o:["Fragmentación interna","Fragmentación externa","Hiperpaginación"],a:1,f:"Hay espacio total suficiente, pero no contiguo: fragmentación externa."}]},
{t:"Paginación",
 h:`<p class="lead">La paginación elimina la fragmentación externa: el proceso ya no necesita estar en un solo bloque.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Explicar páginas, marcos y tabla de páginas.</li><li>Traducir una dirección lógica a física.</li></ul></div>
<h2>La idea central</h2>
<p>La memoria física se divide en bloques de tamaño fijo llamados <b>marcos</b>. El espacio lógico del proceso se divide en bloques del mismo tamaño llamados <b>páginas</b>. Cualquier página puede ir en cualquier marco libre, estén juntos o no.</p>
<div class="def"><b>Tabla de páginas</b>Cada proceso tiene una tabla que indica en qué marco está cada una de sus páginas. La MMU la consulta en cada acceso.</div>
<h2>Traducción de direcciones</h2>
<p>Una dirección lógica se separa en dos partes:</p>
<div class="def"><b>número de página = dirección ÷ tamaño de página (parte entera)</b><b>desplazamiento = dirección mod tamaño de página (el resto)</b><b>dirección física = marco × tamaño de página + desplazamiento</b></div>
<p>La única fragmentación que queda es interna: la última página de un proceso casi nunca se llena por completo. Ejemplo: con páginas de 2048 bytes, un proceso de 72 766 bytes necesita 36 páginas (73 728 bytes) y desperdicia 962 bytes. En promedio se pierde media página por proceso.</p>
<h2>Detalles de diseño</h2>
<div class="def"><b>El tamaño de página es potencia de 2</b>Así la dirección se separa por bits sin dividir: los bits altos son el número de página y los bajos el desplazamiento. Con páginas de 4 KB (2^12), los 12 bits bajos son el desplazamiento.</div>
<div class="def"><b>¿Páginas pequeñas o grandes?</b>Pequeñas: menos fragmentación interna, pero tablas más grandes y más operaciones de disco. Grandes: tablas pequeñas y E/S más eficiente, pero más desperdicio. Hoy lo típico son 4 KB, con páginas grandes opcionales (2 MB, 1 GB).</div>
<div class="def"><b>Dónde vive la tabla</b>Las tablas de páginas están en RAM y un registro del procesador (PTBR) apunta a la de proceso en ejecución. En cada cambio de contexto se carga el PTBR del nuevo proceso. La paginación también permite proteger (bits r/w/x) y compartir páginas entre procesos.</div>
<div class="card"><h3>Pruébalo: traduce una dirección</h3>
<p>Tamaño de página: 1024 bytes. Tabla de páginas: página 0 → marco 5, página 1 → marco 2, página 2 → marco 7, página 3 → marco 0.</p>
<div class="row"><div><label for="pa">Dirección lógica (0 a 4095)</label><input id="pa" type="number" value="2500" min="0" max="4095"></div></div>
<div class="out" id="po"></div></div>`,
 init:function(){var T=[5,2,7,0];function r(){var a=Math.max(0,Math.min(4095,Math.floor(+$("pa").value||0))),p=Math.floor(a/1024),d=a%1024,f=T[p];
  $("po").innerHTML="<b>1.</b> Página = "+a+" ÷ 1024 = <b>"+p+"</b><br><b>2.</b> Desplazamiento = "+a+" mod 1024 = <b>"+d+"</b><br><b>3.</b> La tabla dice: página "+p+" → marco <b>"+f+"</b><br><b>4.</b> Dirección física = "+f+" × 1024 + "+d+" = <b>"+(f*1024+d)+"</b>"}
  $("pa").oninput=r;r()},
 q:[{p:"Con páginas de 1024 bytes, ¿en qué página y desplazamiento está la dirección lógica 3100?",o:["Página 3, desplazamiento 28","Página 2, desplazamiento 1052","Página 3, desplazamiento 1024"],a:0,f:"3100 ÷ 1024 = 3 y sobran 28, así que página 3, desplazamiento 28."},
    {p:"¿Qué tipo de fragmentación sigue existiendo en la paginación?",o:["Externa","Interna","Ninguna"],a:1,f:"La última página de cada proceso puede quedar parcialmente vacía."}]},
{t:"Paginación avanzada: TLB y tablas multinivel",
 h:`<p class="lead">La paginación básica es lenta y ocupa mucho espacio. Este módulo explica cómo los sistemas reales lo resuelven.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Identificar los dos problemas de la tabla de páginas simple.</li><li>Explicar la TLB y calcular el tiempo efectivo de acceso.</li><li>Describir las tablas multinivel e invertidas.</li></ul></div>
<h2>Problema 1: es lenta</h2>
<p>Si la tabla de páginas está en RAM, cada acceso a un dato cuesta dos accesos a memoria: uno para leer la entrada de la tabla y otro para leer el dato. Eso duplica el tiempo.</p>
<h2>Solución: la TLB</h2>
<div class="def"><b>TLB (Translation Lookaside Buffer)</b>Memoria muy rápida dentro de la MMU que guarda las traducciones página → marco usadas recientemente. Si la página está (acierto o hit), la traducción es casi inmediata. Si no (fallo o miss), se consulta la tabla en RAM y el resultado se guarda en la TLB.</div>
<p>Funciona porque los programas repiten accesos a las mismas páginas (principio de localidad). Con tasas de acierto cercanas al 98 % la lentitud casi desaparece.</p>
<div class="def"><b>Tiempo efectivo de acceso (EAT)</b>EAT = h × (t_TLB + t_mem) + (1 − h) × (t_TLB + 2 × t_mem), donde h es la tasa de aciertos.</div>
<div class="card"><h3>Pruébalo: calcula el EAT</h3><div class="row"><div><label for="th">Tasa de aciertos (%)</label><input id="th" type="number" value="98" min="0" max="100"></div><div><label for="tm">Acceso a RAM (ns)</label><input id="tm" type="number" value="100" min="1"></div><div><label for="tt">Acceso a TLB (ns)</label><input id="tt" type="number" value="10" min="0"></div></div><div class="out" id="to"></div></div>
<h2>Problema 2: es enorme</h2>
<p>Con direcciones de 32 bits y páginas de 4 KB existen 2^20 (más de un millón) páginas posibles. Con 4 bytes por entrada, la tabla de cada proceso ocuparía 4 MB aunque use pocas páginas. En 64 bits sería inviable.</p>
<div class="def"><b>Tabla multinivel</b>Se divide el número de página en campos. En dos niveles con 32 bits: 10 bits (índice en la tabla externa) + 10 bits (índice en la tabla interna) + 12 bits de desplazamiento (porque 4 KB = 2^12). Solo se crean en memoria las tablas internas que el proceso realmente usa.</div>
<div class="def"><b>Tabla de páginas invertida</b>En lugar de una tabla por proceso, hay una sola con una entrada por marco físico (proceso + página). Ahorra espacio, pero buscar es más lento, por eso se acompaña de una tabla hash.</div>
<div class="def"><b>Por qué la tabla interna mide 4 KB</b>Con 10 bits de índice hay 2^10 = 1024 entradas de 4 bytes = 4 KB, exactamente una página. Así cada trozo de tabla puede cargarse o sacarse de RAM como una página más.</div>
<h2>La TLB y los cambios de contexto</h2>
<p>Las traducciones de un proceso no sirven a otro. Por eso la TLB se vacía (flush) al cambiar de proceso, o bien cada entrada guarda un <b>ASID</b> (identificador del espacio de direcciones) para distinguir a qué proceso pertenece. El <b>alcance de la TLB</b> es entradas × tamaño de página: 64 entradas × 4 KB = 256 KB; con páginas grandes el alcance crece mucho.</p>
<div class="def"><b>Tabla hash de páginas</b>Alternativa para espacios de 64 bits: el número de página se pasa por una función hash y se busca en una cadena de entradas (página, marco).</div>
<h2>Qué guarda cada entrada</h2>
<p>Además del número de marco: el <b>bit de validez</b> (¿está en RAM?), los <b>bits de protección</b> (lectura, escritura, ejecución), el <b>bit de referencia</b> (¿se usó hace poco?) y el <b>bit de modificación o dirty</b> (¿cambió desde que se cargó?). Una página con dirty = 0 puede descartarse sin escribirla en disco.</p>`,
 init:function(){function r(){var h=Math.min(100,Math.max(0,+$("th").value))/100,m=+$("tm").value,t=+$("tt").value,e=h*(t+m)+(1-h)*(t+2*m);$("to").innerHTML="EAT = "+h+" × ("+t+" + "+m+") + "+(+(1-h).toFixed(4))+" × ("+t+" + 2 × "+m+") = <b>"+e.toFixed(1)+" ns</b>. Sin TLB serían "+(2*m)+" ns: la TLB ahorra "+Math.round((1-e/(2*m))*100)+" %."}
 ["th","tm","tt"].forEach(function(i){$(i).oninput=r});r()},
 q:[{p:"Si la TLB acierta siempre, ¿cuántos accesos a RAM hacen falta para leer un dato?",o:["Dos","Uno","Ninguno"],a:1,f:"La traducción sale de la TLB; solo queda leer el dato en la RAM."},
 {p:"¿Qué ventaja tiene la tabla de páginas multinivel?",o:["Elimina la necesidad de la TLB","No guarda en RAM las partes de la tabla que no se usan","Hace las páginas más grandes"],a:1,f:"Solo se crean las tablas internas necesarias, lo que ahorra memoria."}]},
{t:"Segmentación",
 h:`<p class="lead">Si la paginación divide la memoria por tamaño, la segmentación la divide por significado.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Definir segmento y tabla de segmentos.</li><li>Comparar segmentación con paginación.</li></ul></div>
<h2>La idea central</h2>
<p>Un programa se ve naturalmente como un conjunto de partes: el código, los datos globales, la pila, el montículo (heap). La segmentación respeta esa estructura: cada parte es un <b>segmento</b> de tamaño variable.</p>
<div class="def"><b>Dirección lógica en segmentación</b>Se expresa como (número de segmento, desplazamiento). La <b>tabla de segmentos</b> guarda para cada segmento su <i>base</i> (dónde empieza en la RAM) y su <i>límite</i> (cuánto mide).</div>
<h2>Protección</h2>
<p>Si el desplazamiento es mayor o igual que el límite, la MMU lanza un error (falla de segmentación). Así un proceso no puede leer ni escribir fuera de su segmento. Ejemplo: segmento 2 con base 4000 y límite 500; la dirección (2, 120) es la física 4120, pero (2, 700) es inválida.</p>
<div class="scroll"><table><tr><th>Segmento</th><th>Contenido</th><th>Base</th><th>Límite</th></tr><tr><td>0</td><td>Código</td><td>1400</td><td>1000</td></tr><tr><td>1</td><td>Datos</td><td>6300</td><td>400</td></tr><tr><td>2</td><td>Pila</td><td>4300</td><td>400</td></tr></table></div>
<div class="def"><b>Pasos de la traducción</b>Con la dirección (s, d): 1) se busca la fila s en la tabla de segmentos (el registro STBR apunta a la tabla y STLR indica cuántos segmentos hay); 2) si d ≥ límite, falla de segmentación; 3) si no, dirección física = base + d. Con la tabla de arriba: (0, 300) → 1700; (1, 100) → 6400; (2, 500) es inválida porque 500 ≥ 400.</div>
<h2>Ventajas y límites</h2>
<p>Cada segmento puede tener sus propios permisos (el código solo lectura y ejecución, la pila lectura y escritura) y compartirse completo, como una biblioteca. A cambio, al ser de tamaño variable sufre fragmentación externa y cargar un segmento grande es costoso. Por eso los sistemas actuales prefieren paginar; x86-64 casi no usa segmentación (modelo plano) y la combinación segmentación + paginación quedó como herencia de arquitecturas anteriores.</p>
<h2>Paginación frente a segmentación</h2>
<div class="scroll"><table><tr><th>Aspecto</th><th>Paginación</th><th>Segmentación</th></tr><tr><td>Tamaño de la unidad</td><td>Fijo</td><td>Variable</td></tr><tr><td>Visible al programador</td><td>No</td><td>Sí, refleja la estructura del programa</td></tr><tr><td>Fragmentación</td><td>Interna</td><td>Externa</td></tr><tr><td>Compartir y proteger</td><td>Más difícil</td><td>Más natural (por segmento)</td></tr></table></div>
<p>Muchos sistemas combinan ambas: segmentan el programa y paginan cada segmento.</p>`,
 q:[{p:"Un segmento tiene base 4000 y límite 500. ¿Qué pasa con el acceso (segmento, desplazamiento 700)?",o:["Se traduce a 4700","Es un acceso inválido","Se traduce a 700"],a:1,f:"700 supera el límite de 500, por eso se genera una falla de segmentación."},
    {p:"¿Qué fragmentación presenta la segmentación pura?",o:["Interna","Externa","Ninguna"],a:1,f:"Los segmentos son de tamaño variable, igual que las particiones contiguas."}]},
{t:"Memoria virtual",
 h:`<p class="lead">Permite ejecutar programas más grandes que la RAM y tener más procesos activos a la vez.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Explicar la paginación por demanda y la falla de página.</li><li>Comparar los algoritmos FIFO y LRU.</li><li>Reconocer la hiperpaginación (thrashing).</li></ul></div>
<div class="def"><b>Memoria virtual</b>Técnica que separa la memoria lógica de la física: cada proceso ve un espacio de direcciones grande y propio, aunque solo una parte esté en la RAM; el resto reside en el disco.</div>
<h2>¿Cómo se logra?</h2>
<p>El truco es que un proceso no necesita todas sus páginas en RAM a la vez. Las páginas que no se usan viven en el disco y solo se traen cuando hacen falta: es la <b>paginación por demanda</b>.</p>
<div class="def"><b>Falla de página</b>Ocurre cuando el proceso accede a una página que no está en RAM. El SO la busca en el disco, la carga en un marco libre y reanuda el proceso. Si no hay marcos libres, debe elegir una página “víctima” para sacarla.</div>
<p>Pasos: 1) la MMU ve el bit de validez en 0 y genera una excepción; 2) el SO comprueba que el acceso sea legal; 3) busca un marco libre (o elige víctima y la guarda en disco si dirty = 1); 4) lee la página desde el disco; 5) actualiza la tabla de páginas; 6) reinicia la instrucción.</p>
<h2>Algoritmos de reemplazo</h2>
<div class="def"><b>FIFO</b>Saca la página que lleva más tiempo en memoria. Es simple, pero puede sacar páginas muy usadas.</div>
<div class="def"><b>LRU (menos recientemente usada)</b>Saca la página que lleva más tiempo sin ser usada. Aprovecha que lo usado hace poco probablemente se volverá a usar.</div>
<h2>Costo de las fallas de página</h2>
<div class="def"><b>Tiempo efectivo de acceso con fallas</b>EAT = (1 − p) × t_mem + p × t_falla, donde p es la probabilidad de falla. Con t_mem = 200 ns y t_falla = 8 ms: EAT = 200 + 7 999 800 × p ns. Si p = 1/1000, EAT ≈ 8,2 µs: el sistema va 40 veces más lento. Para que la degradación sea menor al 10 %, p debe ser menor a 1 falla por cada 400 000 accesos.</div>
<p>Por eso importan la localidad y un buen algoritmo de reemplazo. Otras ideas: la <b>paginación por demanda pura</b> arranca el proceso sin ninguna página en RAM; la <b>prepaginación</b> carga varias páginas por adelantado; y se reserva un grupo de marcos libres para atender una falla sin esperar a escribir la víctima.</p>
<h2>Hiperpaginación</h2>
<p>Si hay demasiados procesos y muy pocos marcos por proceso, el sistema pasa más tiempo moviendo páginas entre disco y RAM que ejecutando instrucciones. Esto es el <i>thrashing</i>.</p>
<div class="card"><h3>Pruébalo: simula el reemplazo</h3>
<div class="row"><div><label for="rs">Secuencia de páginas</label><input id="rs" value="7,0,1,2,0,3,0,4,2,3,0,3,2" size="30"></div><div><label for="rf">Marcos</label><select id="rf"><option>2</option><option selected>3</option><option>4</option></select></div><div><label for="ra">Algoritmo</label><select id="ra"><option value="fifo">FIFO</option><option value="lru">LRU</option><option value="opt">Óptimo (OPT)</option></select></div><div><button class="btn ghost" type="button" id="rb">Cargar secuencia de Belady</button></div></div>
<div class="scroll" id="rt"></div><div class="out" id="ro"></div>
<p class="fb">Rojo = falla de página (la página cargada ocupa ese marco). Sin color = acierto. Cada fila es un marco y la página sustituida se reemplaza en su mismo lugar.</p></div>`,
 init:function(){function r(){var s=$("rs").value.split(/[\s,]+/).filter(Boolean).slice(0,24),n=+$("rf").value,a=$("ra").value,fr=[],lt={},lu={},ft=0,rows=[],flt=[];
  s.forEach(function(x,t){var hit=fr.indexOf(x)>=0,v=-1;
   if(!hit){ft++;if(fr.length<n){v=fr.length;fr.push(x)}else{v=0;
    for(var i=1;i<fr.length;i++){if(a=="fifo"){if(lt[fr[i]]<lt[fr[v]])v=i}else if(a=="lru"){if(lu[fr[i]]<lu[fr[v]])v=i}
     else{var nb=s.indexOf(fr[v],t+1),nc=s.indexOf(fr[i],t+1);if(nb<0)nb=1e9;if(nc<0)nc=1e9;if(nc>nb)v=i}}
    fr[v]=x}lt[x]=t}
   lu[x]=t;rows.push(fr.slice());flt.push(hit?-1:v)});
  var html="<table><tr>"+s.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>";
  for(var k=0;k<n;k++){html+="<tr>"+rows.map(function(c,j){var v=c[k];return"<td class='"+(flt[j]==k?"miss":"")+"'>"+(v===undefined?"·":v)+"</td>"}).join("")+"</tr>"}
  $("rt").innerHTML=html+"</table>";$("ro").innerHTML="Fallas de página: <b>"+ft+"</b> de "+s.length+" accesos. Tasa de falla: <b>"+(s.length?Math.round(ft/s.length*100):0)+"%</b>. Prueba cambiar de algoritmo o aumentar los marcos."}
  $("rs").oninput=$("rf").onchange=$("ra").onchange=r;
  $("rb").onclick=function(){$("rs").value="1,2,3,4,1,2,5,1,2,3,4,5";$("rf").value="3";$("ra").value="fifo";r()};r()},
 q:[{p:"¿Qué es una falla de página?",o:["Un error de hardware en la RAM","Acceder a una página que no está en memoria principal","Un proceso que se bloquea"],a:1,f:"No es un error grave: es el mecanismo normal para traer la página desde el disco."},
    {p:"Un sistema pasa casi todo el tiempo intercambiando páginas con el disco. ¿Cómo se llama?",o:["Compactación","Segmentación","Hiperpaginación"],a:2,f:"Es el thrashing: hay muy pocos marcos para los procesos activos."}]},
{t:"Reemplazo avanzado y localidad",
 h:`<p class="lead">FIFO y LRU son solo el comienzo. Aquí se ve por qué la memoria virtual funciona y cómo se evita que colapse.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Explicar la localidad de referencia y el conjunto de trabajo.</li><li>Comparar los algoritmos Óptimo, Reloj y FIFO.</li><li>Reconocer la anomalía de Belady y las políticas de asignación de marcos.</li></ul></div>
<h2>Localidad de referencia</h2>
<p>Los programas no acceden a la memoria al azar. La <b>localidad temporal</b> dice que lo usado hace poco se volverá a usar pronto (por ejemplo, un ciclo). La <b>localidad espacial</b> dice que se usarán direcciones cercanas a las recién usadas (por ejemplo, recorrer un arreglo). Gracias a esto la memoria virtual y la caché funcionan bien.</p>
<h2>Más algoritmos de reemplazo</h2>
<div class="def"><b>Óptimo (OPT)</b>Saca la página que tardará más en volver a usarse. Es el que produce menos fallas posibles, pero exige conocer el futuro, así que solo sirve como referencia para comparar.</div>
<div class="def"><b>Segunda oportunidad / Reloj</b>Aproxima LRU con poco costo. Las páginas se ven como un círculo con una manecilla. Si el bit de referencia es 1, se pone en 0 y se avanza (segunda oportunidad); si es 0, esa página es la víctima.</div>
<div class="def"><b>Preferir páginas no modificadas</b>Sacar una página con dirty = 0 es más barato porque no hay que escribirla en disco.</div>
<h2>La anomalía de Belady</h2>
<p>Intuitivamente, más marcos deberían dar menos fallas. En FIFO no siempre es así. Con la secuencia 1,2,3,4,1,2,5,1,2,3,4,5, FIFO produce 9 fallas con 3 marcos y 10 con 4 marcos. Compruébalo con el botón “Cargar secuencia de Belady” del simulador del módulo de memoria virtual (cambia los marcos entre 3 y 4). LRU y OPT no sufren esta anomalía.</p>
<h2>Conjunto de trabajo y control de la hiperpaginación</h2>
<div class="def"><b>Conjunto de trabajo (working set)</b>Las páginas que un proceso ha usado en sus últimas N referencias. Si el SO le da al proceso al menos esa cantidad de marcos, casi no tendrá fallas. Si no cabe en memoria, el SO suspende un proceso para evitar el thrashing.</div>
<p>Otra técnica es vigilar la <b>frecuencia de fallas de página</b>: si es muy alta, el proceso necesita más marcos; si es muy baja, se le pueden quitar.</p>
<h2>Otros algoritmos y aproximaciones de LRU</h2>
<div class="def"><b>NRU / Reloj mejorado</b>Usa el par (referencia, modificación) y clasifica las páginas: (0,0) no usada ni modificada, la mejor víctima; (0,1) no usada pero modificada; (1,0) usada y limpia; (1,1) usada y modificada, la peor. Se reemplaza de la clase más baja disponible.</div>
<div class="def"><b>LFU y MFU</b>LFU saca la página menos usada (por conteo de accesos); MFU, la más usada, bajo la idea de que la menos usada acaba de llegar. Ninguno se usa mucho por su costo y sus malos resultados.</div>
<p>LRU exacto exige registrar el momento de cada acceso o mantener una pila, lo que es caro en hardware. Por eso los sistemas reales usan aproximaciones con el bit de referencia, como el Reloj.</p>
<h2>Tamaño del conjunto de trabajo y thrashing</h2>
<p>Si D es la suma de los conjuntos de trabajo de todos los procesos y m el número de marcos disponibles, cuando D &gt; m hay thrashing. La política es mantener D ≤ m y suspender procesos cuando no cabe.</p>
<h2>Asignación de marcos</h2>
<p>La asignación puede ser <b>igual</b> (todos los procesos reciben lo mismo) o <b>proporcional</b> al tamaño del proceso. El reemplazo puede ser <b>local</b> (solo entre las páginas del mismo proceso) o <b>global</b> (entre las de todos). El global usa mejor la memoria, pero un proceso puede perjudicar a otro.</p>`,

{t:"Protección, compartición y swapping",
 h:`<p class="lead">Además de repartir memoria, el SO debe cuidar que los procesos no se estorben y permitir que compartan lo que sí pueden compartir.</p>
<div class="card"><h3>Objetivos del módulo</h3><ul class="goals"><li>Describir los mecanismos de protección de memoria.</li><li>Explicar la compartición de páginas y copy-on-write.</li><li>Diferenciar swapping de paginación y conocer ejemplos reales.</li></ul></div>
<h2>Protección</h2>
<p>Cada proceso solo debe acceder a su espacio. El hardware ayuda con: <b>registros base y límite</b> (en asignación contigua), el <b>bit de validez</b> y los <b>bits r/w/x</b> de cada entrada de la tabla de páginas, y el <b>modo kernel/usuario</b>, que impide a los programas de usuario tocar la memoria del núcleo. Un acceso ilegal genera una excepción y el SO suele terminar el proceso (el conocido “segmentation fault”).</p>
<h2>Compartición</h2>
<p>Varios procesos pueden apuntar a los mismos marcos físicos. Así se comparte una sola copia del código de una <b>biblioteca compartida</b> (por ejemplo, la biblioteca estándar de C) en lugar de cargarla en cada proceso. El código compartido debe ser de solo lectura.</p>
<div class="def"><b>Copy-on-write (copiar al escribir)</b>Cuando un proceso crea un hijo (fork), ambos comparten las mismas páginas marcadas como solo lectura. Solo cuando uno intenta escribir, el SO copia esa página y le da su propia versión. Se evita copiar toda la memoria de golpe.</div>
<h2>Swapping e intercambio</h2>
<p>El <b>swapping</b> consiste en sacar de la RAM a disco (área de intercambio o <i>swap</i>) un proceso completo, o parte de él, para liberar espacio, y traerlo de vuelta cuando se necesite. Hoy se hace sobre todo por páginas, que es la paginación de la memoria virtual.</p>
<h2>Espacio de direcciones de un proceso</h2>
<p>De las direcciones bajas a las altas: <b>código</b> (solo lectura), <b>datos</b> (variables globales), <b>montículo o heap</b> (memoria dinámica, crece hacia arriba) y <b>pila</b> (llamadas y variables locales, crece hacia abajo). Entre el heap y la pila queda un espacio libre que solo se asigna cuando hace falta. En la parte alta o en una zona aparte se mapea el núcleo, inaccesible desde modo usuario.</p>
<h2>Archivos mapeados y mecanismos de seguridad</h2>
<div class="def"><b>Archivo mapeado en memoria (mmap)</b>Se asocia un archivo a un rango de direcciones; al acceder a él, la paginación por demanda trae los bloques del disco. Sirve también para compartir memoria entre procesos.</div>
<div class="def"><b>Bit NX y ASLR</b>El bit NX marca páginas de datos como no ejecutables para dificultar ataques por desbordamiento de búfer. ASLR cambia al azar las direcciones base de pila, heap y bibliotecas en cada ejecución.</div>
<div class="def"><b>Memoria del núcleo</b>Linux usa el sistema buddy para páginas físicas y el asignador <i>slab</i> para objetos pequeños del núcleo (por ejemplo, descriptores de procesos), evitando fragmentación y reutilizando objetos.</div>
<p>En <b>fork</b>, el hijo comparte las páginas del padre con copy-on-write; en <b>exec</b>, se reemplaza el espacio de direcciones por el del nuevo programa. Las páginas nuevas se entregan <i>llenas de ceros</i> (zero-fill-on-demand) para no filtrar datos de otro proceso.</p>
<h2>Ejemplos reales</h2>
<div class="scroll"><table><tr><th>Sistema</th><th>Cómo lo aplica</th></tr><tr><td>Linux</td><td>Memoria virtual paginada con tablas multinivel; partición o archivo swap; si se agota la memoria, el OOM killer termina procesos.</td></tr><tr><td>Windows</td><td>Memoria virtual paginada; archivo de paginación (pagefile.sys); conjunto de trabajo por proceso.</td></tr></table></div>`,

 {p:"¿Para qué sirve el área de intercambio (swap)?",o:["Acelerar la caché","Guardar en disco páginas o procesos sacados de la RAM","Proteger los segmentos"],a:1,f:"Es el espacio de disco donde se guarda lo que se saca de la memoria principal."}]},
{t:"Repaso y glosario",
 h:`<p class="lead">Cierra el recorrido uniendo todas las piezas.</p>
<div class="card"><h3>La idea completa en un párrafo</h3><p>El proceso genera direcciones lógicas. La MMU las traduce usando una tabla de páginas o de segmentos. Si la página no está en RAM, ocurre una falla de página y el SO la trae del disco, sacando otra si hace falta. Todo esto da a cada proceso la ilusión de tener su propia memoria, grande y protegida.</p></div>
<h2>Comparación rápida</h2>
<div class="scroll"><table><tr><th>Técnica</th><th>Unidad</th><th>Problema típico</th></tr><tr><td>Asignación contigua</td><td>Bloque variable</td><td>Fragmentación externa</td></tr><tr><td>Paginación</td><td>Página fija</td><td>Fragmentación interna</td></tr><tr><td>Segmentación</td><td>Segmento variable</td><td>Fragmentación externa</td></tr><tr><td>Memoria virtual</td><td>Página bajo demanda</td><td>Hiperpaginación</td></tr></table></div>
<h2>Glosario</h2>
<div class="card"><p><b>MMU:</b> hardware que traduce direcciones lógicas en físicas.<br><b>Marco:</b> bloque fijo de memoria física.<br><b>Página:</b> bloque fijo del espacio lógico.<br><b>Tabla de páginas:</b> relaciona páginas con marcos.<br><b>Segmento:</b> parte lógica del programa (código, pila, datos).<br><b>Fragmentación:</b> memoria desperdiciada o inutilizable.<br><b>Compactación:</b> juntar huecos libres moviendo procesos.<br><b>Falla de página:</b> acceso a una página que no está en RAM.<br><b>Thrashing:</b> exceso de intercambio de páginas que frena el sistema.<br><b>RAM:</b> memoria principal, volátil y de acceso directo.<br><b>Espacio de direcciones:</b> direcciones que un proceso puede usar.<br><b>Memoria virtual:</b> ilusión de memoria grande y propia, con parte en disco.<br><b>TLB:</b> caché de traducciones página → marco.<br><b>Localidad:</b> tendencia a reutilizar páginas y direcciones cercanas.<br><b>Conjunto de trabajo:</b> páginas usadas en las últimas N referencias.<br><b>Copy-on-write:</b> copiar una página solo cuando se escribe.<br><b>Swapping:</b> mover procesos o páginas entre RAM y disco.</p></div>
